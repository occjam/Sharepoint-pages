<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Daily Operational Report</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--navy:#0C2340;--navy2:#0F2444;--panel:#12294A;--line:#1D3D64;--line2:#16304F;--amber:#F5A623;--blue:#5FA8E8;--ink:#E8EEF6;--mut:#9DB0C9;--good:#3DBE8B;--bad:#E2564F;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--navy);color:var(--ink);font-family:Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#0A1D36;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;}
  .mark{width:28px;height:28px;border-radius:6px;background:var(--amber);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .period{font-size:12px;color:var(--mut);font-weight:400;}
  .gen{font-size:11px;color:var(--mut);}
  .hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .hdr-links{display:flex;gap:8px;flex-wrap:wrap;}
  .controls{display:flex;align-items:center;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap;}
  .toggle{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .toggle button{background:none;border:none;color:var(--mut);padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .toggle button.on{background:var(--amber);color:var(--navy);font-weight:600;}
  select,input[type=date]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;cursor:pointer;}
  select:focus,input:focus{outline:none;border-color:var(--amber);}
  input[type=date]{color-scheme:dark;}
  label.f{font-size:11px;color:var(--mut);}
  .spacer{flex:1;}
  .reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;padding:16px 20px;}
  .kpi{background:var(--panel);border-radius:10px;padding:12px 14px;}
  .kpi .lab{font-size:11px;color:var(--mut);}
  .kpi .val{font-size:24px;font-weight:600;margin-top:4px;line-height:1;}
  .kpi .sub{font-size:11px;color:var(--mut);margin-top:3px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 20px 16px;}
  .grid2.wide{grid-template-columns:1.4fr 1fr;}
  @media(max-width:820px){.grid2,.grid2.wide{grid-template-columns:1fr;}}
  .card{background:var(--navy2);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;}
  .card h3{font-size:12px;color:var(--mut);font-weight:500;margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;gap:8px;}
  .card h3 .tag{font-size:10px;color:var(--mut);text-transform:none;letter-spacing:0;}
  .chartbox{position:relative;height:230px;}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--mut);margin-bottom:8px;flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .sw{width:14px;height:3px;display:inline-block;}
  .bars{display:flex;flex-direction:column;gap:10px;}
  .bar .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
  .bar .track{height:7px;background:var(--line2);border-radius:4px;overflow:hidden;}
  .bar .fill{height:7px;border-radius:4px;}
  .gse{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
  .gse div{background:var(--panel);border-radius:8px;padding:10px;text-align:center;}
  .gse .v{font-size:20px;font-weight:600;}
  .gse .l{font-size:10px;color:var(--mut);margin-top:2px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;color:var(--mut);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--navy2);}
  td{padding:6px 8px;border-bottom:1px solid var(--line2);}
  td.n,th.n{text-align:right;}
  .otp-pill{padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;}
  .scroll{max-height:320px;overflow-y:auto;}
  .rmk{padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px;}
  .rmk .meta{display:flex;gap:8px;color:var(--mut);font-size:11px;margin-bottom:3px;align-items:center;}
  .rmk .meta .a{color:var(--amber);}
  .heal{font-size:9px;background:#1D3D64;color:var(--blue);padding:1px 5px;border-radius:8px;}
  .empty{color:var(--mut);font-size:12px;padding:14px 0;text-align:center;}
  .wbsec{padding:6px 20px 30px;}
  .wbsec-h{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
  .wbsec-b{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .wbtn{display:inline-flex;align-items:center;gap:6px;background:var(--amber);color:var(--navy);font-weight:600;font-size:13px;padding:9px 14px;border-radius:8px;text-decoration:none;}
  .wbtn.off{background:var(--panel);color:var(--mut);font-weight:400;cursor:default;}
  .wbnote{font-size:11px;color:var(--mut);margin-top:8px;}
  .foot{padding:14px 20px 26px;font-size:11px;color:var(--mut);line-height:1.6;}
</style></head>
<body><div class="wrap">
  <header>
    <div class="brand"><span class="mark">M</span> Daily Operational Report <span class="period" id="period"></span></div>
    <div class="hdr-right"><span class="gen" id="gen"></span><span class="hdr-links" id="wblinks"></span></div>
  </header>
  <div class="controls">
    <label class="f">Station</label><select id="stationF"></select>
    <label class="f">Year</label><select id="yearF"></select>
    <label class="f">Month</label><select id="monthF"></select>
    <label class="f">From</label><input type="date" id="fromF"/>
    <label class="f">To</label><input type="date" id="toF"/>
    <label class="f">Airline</label><select id="airF"></select>
    <span class="spacer"></span>
    <button class="reset" id="reset">Reset</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid2 wide">
    <div class="card"><h3>On-time performance <span class="tag" id="trendtag"></span></h3>
      <div class="legend" id="trendlegend"></div>
      <div class="chartbox"><canvas id="trend" role="img" aria-label="On-time performance over the selected range"></canvas></div></div>
    <div class="card"><h3>Flight status split</h3><div class="bars" id="status"></div><div class="gse" id="gse"></div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Delay responsibility <span class="tag" id="partytag"></span></h3><div class="bars" id="parties"></div></div>
    <div class="card"><h3>Most-delayed airlines</h3><div class="bars" id="topdelay"></div></div>
  </div>
  <div class="grid2 wide">
    <div class="card"><h3>Per-airline on-time performance</h3><div class="scroll"><table id="airtable"></table></div></div>
    <div class="card"><h3>Menzies delay remarks</h3><div class="scroll" id="remarks"></div></div>
  </div>
</div>

function bounds(){ // overall min/max date available in current view
  let lo=null,hi=null;

function compute(){
  const A=[],P=[],G=[],MZ=[];
  stationsFor().forEach(c=>{
    S[c].facts.forEach(f=>{ if(!inRange(f.dt))return;
      if(f.t==='A'){ if(airF!=='all'&&f.k!==airF)return; A.push(f);}
      else if(f.t==='P') P.push(f);
      else if(f.t==='G') G.push(f);
    });
    S[c].menz.forEach(m=>{ if(!inRange(m.dt))return; if(airF!=='all'&&m.k!==airF)return; MZ.push(m);});
  });
  const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
  const early=sum(A,'e'),ontime=sum(A,'o'),delayed=sum(A,'dl'),canx=sum(A,'cx'),ron=sum(A,'rn');
  const base=early+ontime+delayed;
  const menz=sum(MZ,'n');
  const am={};A.forEach(f=>{const t=am[f.k]||(am[f.k]={name:f.k,early:0,ontime:0,delayed:0,menz:0});t.early+=f.e;t.ontime+=f.o;t.delayed+=f.dl;});
  MZ.forEach(m=>{const t=am[m.k]||(am[m.k]={name:m.k,early:0,ontime:0,delayed:0,menz:0});t.menz+=m.n;});
  const airlines=Object.values(am).map(a=>{const b=a.early+a.ontime+a.delayed;a.total=b;a.otp=b?(a.early+a.ontime)/b:0;a.motp=b?(b-Math.min(a.menz,b))/b:null;return a;}).sort((x,y)=>y.total-x.total);
  const pm={};P.forEach(f=>pm[f.k]=(pm[f.k]||0)+f.e);
  const gm={GPU:0,ACU:0,ASU:0};G.forEach(f=>gm[f.k]=(gm[f.k]||0)+f.e);
  return {early,ontime,delayed,canx,ron,base,menz,airOn:airF!=='all',
          stnOTP:base?(early+ontime)/base:null, menzOTP:base?(base-Math.min(menz,base))/base:null,
          airlines,parties:pm,gse:gm};
}

function trendSeries(code){
  const map={};
  S[code].facts.forEach(f=>{ if(f.t!=='A'||!inRange(f.dt))return; if(airF!=='all'&&f.k!==airF)return;
    const m=map[f.dt]||(map[f.dt]=[0,0,0,0]); m[0]+=f.e;m[1]+=f.o;m[2]+=f.dl;});
  S[code].menz.forEach(z=>{ if(!inRange(z.dt))return; if(airF!=='all'&&z.k!==airF)return;
    const m=map[z.dt]||(map[z.dt]=[0,0,0,0]); m[3]+=z.n;});
  return Object.keys(map).sort().map(dt=>{const[e,o,dl,mz]=map[dt];const b=e+o+dl;
    return {dt,stn:b?(e+o)/b:null,menz:b?(b-Math.min(mz,b))/b:null};});
}

function todayYM(){const d=new Date();return [d.getFullYear(),d.getMonth()+1];}
function wbUrl(code){
  const [y,m]=todayYM();
  const p=S[code].periods.find(x=>x.year===y&&x.month===m);   // today's month, if baked -> exact live URL

  if(DATA.siteBase&&S[code].wbtpl){                            // else build today's path from template

    const mn=['','January','February','March','April','May','June','July','August','September','October','November','December'][m];
    const rel=S[code].wbtpl.replace(/\{Y\}/g,String(y)).replace(/\{M2\}/g,mm).replace(/\{MONTH\}/g,mn).replace(/\{M\}/g,mm);
    return DATA.siteBase.replace(/\/$/,'')+'/'+rel.split('/').map(encodeURIComponent).join('/')+'?web=1';
  }
  return null;
}
function renderWorkbookLinks(){
  const el=document.getElementById('wblinks'); if(!el)return;

(function(){const r=loadSel(); view=(r&&stOpts.includes(r))?r:(CODES.includes('MBJ')?'MBJ':CODES[0]);})();
const stF=document.getElementById('stationF');
stF.innerHTML=stOpts.map(o=>`<option value="${o}" ${o===view?'selected':''}>${o==='JAMAICA'?'Jamaica':o}</option>`).join('');
stF.onchange=()=>{view=stF.value;saveSel(view);rebuildAir();initDefault();render();};
function rebuildAir(){const airs=[...new Set(stationsFor().flatMap(c=>S[c].airlines))].sort();
  if(airF!=='all'&&!airs.includes(airF))airF='all';
  document.getElementById('airF').innerHTML='<option value="all">All airlines</option>'+airs.map(a=>`<option ${a===airF?'selected':''}>${a}</option>`).join('');}
document.getElementById('yearF').onchange=()=>{fillPeriodSelectors();const m=document.getElementById('monthF').value;snapToMonth(m);render();};
document.getElementById('monthF').onchange=e=>{snapToMonth(e.target.value);render();};
document.getElementById('fromF').onchange=e=>{fromD=e.target.value;if(toD<fromD)toD=fromD;syncDateInputs();render();};
document.getElementById('toF').onchange=e=>{toD=e.target.value;if(fromD>toD)fromD=toD;syncDateInputs();render();};
document.getElementById('airF').onchange=e=>{airF=e.target.value;render();};
document.getElementById('reset').onclick=()=>{airF='all';rebuildAir();initDefault();render();};
rebuildAir();initDefault();render();
</script></body></html>
