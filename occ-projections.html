<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Projections — MBJ / KIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-0:#071120; --ink-1:#0B1B30; --ink-2:#102743;
    --gold:#F6C04A; --gold-bright:#FFD873; --amber:#FFB02E;
    --text:#EEF3FA; --muted:#8194B0;
    --line:rgba(246,192,74,.16);
    --tile:rgba(255,255,255,.022);
    --tile-hi:rgba(246,192,74,.06);
  }
  :root[data-theme="national"],:root[data-theme="heroes"],:root[data-theme="emancipation"],:root[data-theme="independence"],:root[data-theme="labour-day"]{ --ink-2:#0b1c10; --ink-1:#08140b; --ink-0:#040b06; --gold:#FFD24A; --gold-bright:#FFE08A; --amber:#2DBE6A; --line:rgba(45,190,106,.22); --tile-hi:rgba(45,190,106,.08); }
  :root[data-theme="festive"],:root[data-theme="christmas"],:root[data-theme="boxing-day"]{ --ink-2:#0d2c20; --ink-1:#09211a; --ink-0:#05140e; --gold:#FFE39A; --gold-bright:#FFEFC2; --amber:#E8554E; --line:rgba(255,227,154,.18); --tile-hi:rgba(255,227,154,.07); }
  :root[data-theme="newyear"]{ --ink-2:#11183a; --ink-1:#0b1026; --ink-0:#060818; --gold:#FFD23F; --gold-bright:#FFE89A; --amber:#FF8FB8; --line:rgba(255,210,63,.2); --tile-hi:rgba(255,210,63,.07); }
  :root[data-theme="halloween"]{ --ink-2:#1d1233; --ink-1:#140a26; --ink-0:#0a0516; --gold:#FF9A3C; --gold-bright:#FFB469; --amber:#FF8A3C; --line:rgba(255,154,60,.20); --tile-hi:rgba(255,154,60,.07); }
  :root[data-theme="easter"]{ --ink-2:#123033; --ink-1:#0b2023; --ink-0:#061416; --gold:#FCE1A8; --gold-bright:#FFF0CC; --amber:#86D9C4; --line:rgba(134,217,196,.20); --tile-hi:rgba(134,217,196,.07); }
  :root[data-theme="solemn"],:root[data-theme="ash-wednesday"],:root[data-theme="good-friday"]{ --ink-2:#1b232e; --ink-1:#121922; --ink-0:#0b1117; --gold:#C7B890; --gold-bright:#DAC9A0; --amber:#9FB0C4; --line:rgba(199,184,144,.15); --tile-hi:rgba(199,184,144,.06); }
  :root[data-theme="breast-cancer"]{ --ink-2:#2a1420; --ink-1:#1e0e17; --ink-0:#12070d; --gold:#FF8FB8; --gold-bright:#FFB3D1; --amber:#FF5FA2; --line:rgba(255,143,184,.22); --tile-hi:rgba(255,143,184,.07); }
  :root[data-theme="reggae"],:root[data-theme="jamaica-day"]{ --ink-2:#0e2414; --ink-1:#0a1a0e; --ink-0:#061008; --gold:#FFD23F; --gold-bright:#FFE27A; --amber:#E8402E; --line:rgba(255,210,63,.22); --tile-hi:rgba(255,210,63,.07); }
  :root[data-theme="carnival"]{ --ink-2:#1b1038; --ink-1:#120a26; --ink-0:#0a0518; --gold:#FF5FB0; --gold-bright:#FF93CC; --amber:#17C3C3; --line:rgba(255,95,176,.26); --tile-hi:rgba(255,95,176,.09); }
  :root[data-theme="thanksgiving"]{ --ink-2:#2a1a0e; --ink-1:#1e120a; --ink-0:#120a05; --gold:#E8933C; --gold-bright:#FFB85C; --amber:#C85A2A; --line:rgba(232,147,60,.22); --tile-hi:rgba(232,147,60,.07); }
  :root[data-theme="aviation"],:root[data-theme="natl-aviation"],:root[data-theme="flight-attendant"],:root[data-theme="atc"],:root[data-theme="pilots"]{ --ink-2:#0d2742; --ink-1:#0a1c30; --ink-0:#06121f; --gold:#58C0F0; --gold-bright:#9AD8FF; --amber:#F6C04A; --line:rgba(88,192,240,.22); --tile-hi:rgba(88,192,240,.07); }
  :root[data-theme="tourism"]{ --ink-2:#0c3a44; --ink-1:#08272e; --ink-0:#04171c; --gold:#FFC53D; --gold-bright:#FFE08A; --amber:#2EC4B6; --line:rgba(255,197,61,.22); --tile-hi:rgba(255,197,61,.07); }
  :root[data-theme="child"]{ --ink-2:#123a52; --ink-1:#0d2a3d; --ink-0:#081a28; --gold:#FFC53D; --gold-bright:#FFE08A; --amber:#FF7A59; --line:rgba(255,197,61,.22); --tile-hi:rgba(255,197,61,.08); }
  :root[data-theme="mens-health"]{ --ink-2:#102a3a; --ink-1:#0b1e2c; --ink-0:#07141d; --gold:#4FA8E0; --gold-bright:#7FC8F0; --amber:#2E6E9E; --line:rgba(79,168,224,.22); --tile-hi:rgba(79,168,224,.07); }
  :root[data-theme="earth"]{ --ink-2:#0e2e2a; --ink-1:#0a211e; --ink-0:#061513; --gold:#4FD08A; --gold-bright:#86E8B4; --amber:#58C0F0; --line:rgba(79,208,138,.22); --tile-hi:rgba(79,208,138,.07); }
  .head{position:relative;}
  .head-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .head .eyebrow,.head h1{position:relative;z-index:2;}
  .headmotif{position:absolute;top:2px;right:6px;width:248px;height:110px;z-index:1;pointer-events:none;opacity:.92;}
  .headmotif svg{width:100%;height:100%;overflow:visible;}
  .season-label{display:none;position:relative;z-index:2;margin-top:7px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:var(--gold-bright);background:var(--tile-hi);}
  .theme-toggle{z-index:3;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .theme-toggle:hover{color:var(--text);border-color:rgba(246,192,74,.4);}
  .theme-toggle .st{color:var(--gold-bright);} .theme-toggle.off{opacity:.6;} .theme-toggle.off .st{color:var(--muted);}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0B1B30;}
  body{font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:14px;color:var(--text);
    background:radial-gradient(120% 90% at 85% 0%, rgba(255,176,46,.05), transparent 55%),
      linear-gradient(160deg,var(--ink-2),var(--ink-1) 55%,var(--ink-0));height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .45s ease;}
  .head,.filters{flex:0 0 auto;}
  #app{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px;}
  #app::-webkit-scrollbar{width:10px;}
  #app::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:6px;}
  #app::-webkit-scrollbar-thumb{background:rgba(246,192,74,.28);border-radius:6px;}
  #app::-webkit-scrollbar-thumb:hover{background:rgba(246,192,74,.45);}
  a{text-decoration:none;color:inherit;}

  /* header */
  .head{margin:2px 2px 18px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:9px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 9px 1px rgba(246,192,74,.6);}
  h1{font-size:clamp(24px,3.4vw,38px);font-weight:700;letter-spacing:-.015em;line-height:1;}
  h1 .accent{color:var(--gold);}

  /* filter bar */
  .filters{display:flex;gap:clamp(14px,2vw,28px);flex-wrap:wrap;align-items:flex-start;justify-content:space-between;
    margin:16px 2px 22px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--tile);}
  .filters-main{display:flex;flex-direction:column;gap:12px;flex:0 1 auto;min-width:0;}
  .filter-row{display:flex;gap:clamp(10px,1.4vw,18px);flex-wrap:wrap;align-items:flex-end;}
  .rightcol{display:flex;flex-direction:column;align-items:flex-end;gap:18px;flex:0 0 auto;}
  .rightfilters{display:flex;gap:14px;align-items:flex-end;justify-content:flex-end;}
  .daterange{display:flex;align-items:center;gap:8px;}
  .darrow{color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  input[type=date]{background:#0e2238;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-size:13px;color-scheme:dark;min-width:150px;}
  .week-summary{display:flex;flex-direction:column;align-items:flex-end;gap:18px;text-align:right;flex:0 0 auto;padding-left:8px;}
  .ws-station{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .ws-count{display:flex;align-items:center;gap:12px;}
  .ws-count b{font-size:46px;font-weight:700;line-height:.85;color:var(--text);}
  .ws-lbl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.2;}
  .ws-lbl span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);}
  .ws-lbl small{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-bright,#FFD873);}
  .ws-open{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:8px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:var(--gold-bright,#FFD873);text-decoration:none;
    background:rgba(246,192,74,.06);transition:background .15s;}
  .ws-open:hover{background:rgba(246,192,74,.14);}
  .ws-open.disabled{color:var(--muted);background:transparent;cursor:default;}
  .filter{display:flex;flex-direction:column;gap:6px;}
  .flabel{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);padding-left:2px;}
  .selwrap{position:relative;}
  .selwrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);
    color:var(--gold);pointer-events:none;font-size:11px;}
  select{
    appearance:none;-webkit-appearance:none;
    font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.03em;
    color:var(--text);background:var(--ink-2);border:1px solid var(--line);
    border-radius:9px;padding:10px 34px 10px 14px;min-width:150px;cursor:pointer;
    transition:border-color .15s ease;
  }
  select:hover{border-color:rgba(246,192,74,.4);}
  select:focus{outline:none;border-color:var(--gold);}
  select option{background:var(--ink-1);color:var(--text);}
  select:disabled{opacity:.4;cursor:not-allowed;}

  /* station section */
  .station{margin-bottom:clamp(20px,2.6vw,28px);}
  .station:last-child{margin-bottom:0}
  .station-label{display:flex;align-items:center;gap:12px;
    font-family:'IBM Plex Mono',monospace;font-size:clamp(11px,1.1vw,13px);
    letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 2px 14px;}
  .station-label .full{color:var(--muted);letter-spacing:.08em;}
  .station-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}

  /* featured current-week card */
  .featured{display:grid;grid-template-columns:1fr auto;align-items:center;gap:clamp(16px,2.4vw,32px);
    padding:clamp(18px,2.2vw,26px) clamp(20px,2.6vw,30px);
    border:1px solid rgba(246,192,74,.5);border-radius:13px;margin-bottom:14px;
    background:linear-gradient(135deg,rgba(246,192,74,.10),rgba(246,192,74,.02) 60%),var(--ink-2);
    transition:transform .16s ease, box-shadow .16s ease;}
  .featured:hover{transform:translateY(-2px);box-shadow:0 18px 40px -22px rgba(0,0,0,.85);}
  .f-pill{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .f-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .f-week{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.01em;}
  .f-dates{font-family:'IBM Plex Mono',monospace;color:var(--gold-bright);font-size:clamp(13px,1.4vw,15px);margin-top:4px;}
  .f-note{color:var(--muted);font-size:clamp(12px,1.3vw,14px);margin-top:10px;max-width:52ch;}
  .f-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .f-count{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;line-height:1;}
  .f-count b{font-size:clamp(30px,4.4vw,46px);font-weight:600;color:var(--text);}
  .f-count span{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:4px;}
  .f-open{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--gold);
    border:1px solid rgba(246,192,74,.4);border-radius:8px;padding:7px 12px;transition:all .16s ease;white-space:nowrap;}
  .featured:hover .f-open{background:rgba(246,192,74,.12);color:var(--gold-bright);border-color:rgba(246,192,74,.6);}

  /* other weeks grid */
  .weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:clamp(10px,1.2vw,13px);}
  .week{border:1px solid var(--line);border-radius:11px;padding:14px 16px;background:var(--tile);
    display:flex;flex-direction:column;gap:5px;
    transition:transform .16s ease, border-color .16s ease, background .16s ease;}
  .week:hover{transform:translateY(-2px);border-color:rgba(246,192,74,.45);background:var(--tile-hi);}
  .w-num{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold);letter-spacing:.08em;font-size:13px;}
  .w-dates{font-family:'IBM Plex Mono',monospace;color:var(--text);font-size:13px;}
  .w-meta{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35;}
  .w-meta b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  .w-pending{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:.9em;letter-spacing:.06em;}

  /* ── flight list ── */
  .flights-head{display:flex;align-items:center;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:6px 2px 14px;}
  .flights-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}
  .featured + .flights-head{margin-top:26px;}
  .fl-controls{display:flex;align-items:flex-end;gap:16px;margin:0 2px 16px;flex-wrap:wrap;}
  .fl-hint{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.05em;padding-bottom:11px;}
  .daytabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;max-width:calc(34px*14 + 5px*13);}   /* exactly 14 days visible, scroll beyond */
  .daytab{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:6px 0;width:34px;cursor:pointer;background:var(--tile,rgba(255,255,255,.022));text-align:center;font-family:'IBM Plex Mono',monospace;line-height:1.15;transition:all .15s ease;}
  .daytab .dow{display:block;color:var(--muted);font-size:8.5px;letter-spacing:.03em;}
  .daytab .dnum{display:block;font-size:14px;font-weight:600;margin-top:1px;}
  .daytab .dmon{display:block;color:var(--gold);font-size:7.5px;letter-spacing:.06em;margin-top:1px;opacity:.85;}
  .daytab.active .dmon{color:#071120;opacity:.9;}
  .daytab:hover{border-color:rgba(246,192,74,.4);}
  .daytab.active{background:var(--gold);color:#071120;border-color:var(--gold);} .daytab.active .dow{color:#071120;}
  .daytab.wknd{background:rgba(78,168,255,.06);} .daytab.void{opacity:.4;}
  .daytab.today .dnum::after{content:" •";color:#4ADE80;font-size:10px;} .daytab.active.today .dnum::after{color:#071120;}
  .monsep{flex:0 0 auto;display:flex;align-items:center;padding:0 7px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--gold);opacity:.85;}
  .daytabs::-webkit-scrollbar{height:7px;} .daytabs::-webkit-scrollbar-track{background:rgba(255,255,255,.03);border-radius:5px;} .daytabs::-webkit-scrollbar-thumb{background:rgba(246,192,74,.28);border-radius:5px;}
  .ftable{border:1px solid var(--line);border-radius:12px;overflow-x:auto;background:rgba(255,255,255,.015);width:100%;}
  .frow{display:grid;grid-template-columns:110px 46px minmax(108px,0.9fr) 64px 64px minmax(158px,1.5fr) minmax(158px,1.5fr) 66px minmax(96px,0.9fr);align-items:center;gap:10px;padding:0 16px;min-width:960px;}
  .fhead{height:38px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);border-bottom:1px solid var(--line);}
  .fbody .frow{height:52px;border-bottom:1px solid rgba(255,255,255,.04);}
  .fbody .frow:nth-child(odd){background:rgba(255,255,255,.02);}
  .fbody .frow:last-child{border-bottom:none;}
  .flogo{display:flex;align-items:center;}
  .alogo-chip{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;padding:4px 8px;height:38px;min-width:58px;max-width:100px;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .alogo{height:28px;width:auto;max-width:84px;object-fit:contain;display:block;}
  .fcode{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--gold-bright,#FFD873);font-size:13px;}
  .fnum{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;white-space:nowrap;}
  .fnsep{color:var(--muted);font-weight:400;margin:0 1px;}
  .fhead-air{grid-column:1 / span 2;}
  .fflt{font-weight:600;font-size:14px;font-family:'IBM Plex Mono',monospace;}
  .fflt.dim{color:var(--muted);font-weight:500;}
  .ftime{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:13px;}
  .froute{font-family:'IBM Plex Mono',monospace;color:var(--gold-bright,#FFD873);font-size:12.5px;letter-spacing:.02em;}
  .fport{font-family:'IBM Plex Mono',monospace;color:var(--gold-bright,#FFD873);font-size:12.5px;letter-spacing:.03em;}
  .fport.fdest{color:#EAD9A6;}
  .fcity{color:var(--muted);font-size:11px;letter-spacing:.02em;}
  .facft{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12.5px;}
  .ftype{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;justify-self:start;
    padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
  .ftype.ta{color:#4ADE80;border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07);}
  .ftype.ron{color:#4EA8FF;border-color:rgba(78,168,255,.35);background:rgba(78,168,255,.07);}
  .ftype.cgo{color:#C4A6F7;border-color:rgba(183,148,246,.4);background:rgba(183,148,246,.08);}
  .ftype.fs{color:#FBA94C;border-color:rgba(251,146,60,.42);background:rgba(251,146,60,.08);}
  .ftype.oth{color:var(--muted);border-color:var(--line);background:rgba(255,255,255,.03);}
  .ftype-cell{display:flex;align-items:center;gap:6px;justify-self:start;}
  .redeye-badge{font-size:13px;color:#A5B4FC;line-height:1;}
  .controw,.ronrow{background:rgba(78,168,255,.05)!important;box-shadow:inset 3px 0 0 rgba(78,168,255,.55);}
  .cont-mark{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4EA8FF;letter-spacing:.04em;}
  .fcount{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);margin:12px 2px 0;text-align:right;letter-spacing:.05em;}
  .viewbar{display:flex;justify-content:flex-end;margin:0 2px 12px;}
  .vtoggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .vbtn{background:transparent;border:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;padding:7px 15px;cursor:pointer;}
  .vbtn.on{background:rgba(246,192,74,.14);color:var(--gold-bright,#FFD873);}
  .vbtn:not(.on):hover{color:var(--text);}
  .tl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.015);padding:12px 0 8px;}
  .tl-inner{position:relative;}
  .tl-axis{position:relative;height:22px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .tl-hr{position:absolute;top:3px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.03em;white-space:nowrap;}
  .tl-body{position:relative;}
  .tl-grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.05);}
  .tl-now{position:absolute;top:0;bottom:0;width:2px;background:rgba(246,192,74,.7);box-shadow:0 0 6px rgba(246,192,74,.5);}
  .tl-conc-wrap{position:relative;margin-top:10px;padding-top:16px;border-top:1px solid var(--line);}
  .tl-conc-lbl{position:absolute;top:2px;left:6px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .tl-conc-lbl b{color:var(--gold-bright,#FFD873);}
  .tl-conc rect{fill:transparent;pointer-events:all;cursor:crosshair;}
  .tl-conc rect:hover{fill:rgba(246,192,74,.16);}
  .tl-bar{position:absolute;height:22px;border-radius:5px;display:flex;align-items:center;padding:0 7px;overflow:hidden;border:1px solid transparent;box-sizing:border-box;}
  .tl-lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tl-bar.ta{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.55);color:#c6f6d5;}
  .tl-bar.ron{background:rgba(78,168,255,.16);border-color:rgba(78,168,255,.55);color:#d3e8ff;}
  .tl-bar.cgo{background:rgba(183,148,246,.16);border-color:rgba(183,148,246,.55);color:#e8dcff;}
  .tl-bar.fs{background:rgba(251,146,60,.16);border-color:rgba(251,146,60,.55);color:#ffe2c4;}
  .tl-bar.oth{background:rgba(129,148,176,.16);border-color:rgba(129,148,176,.55);color:#dbe3ef;}
  .fempty{padding:26px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;}
  @media (max-width:620px){
    .featured{grid-template-columns:1fr;gap:16px;}
  }

  .pending{opacity:.5;pointer-events:none;}
  .empty{padding:38px 20px;text-align:center;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.05em;
    border:1px dashed var(--line);border-radius:12px;}

  @media (max-width:560px){
    .featured{grid-template-columns:1fr;}
    .f-right{text-align:left;align-items:flex-start;flex-direction:row;justify-content:space-between;width:100%;}
    select{min-width:0;width:100%;}
    .filter{flex:1 1 140px;}
  }
  @media (prefers-reduced-motion:reduce){.featured,.week{transition:none}.f-pill .dot{animation:none}}

</head>
<body>

  <div class="head">
    <div class="head-top">
      <div class="eyebrow"><span class="dot"></span>Menzies AJAS Ltd · Operations Planning</div>
      <button class="theme-toggle" id="themeToggle" title="Toggle seasonal themes">Seasonal&nbsp;<span class="st" id="ttState">on</span></button>
    </div>
    <h1>Flight <span class="accent">Projections</span></h1>
    <div class="headmotif" id="headmotif"></div>
    <div class="season-label" id="seasonLabel"></div>
  </div>

  <div class="filters">
    <div class="filters-main">
      <div class="filter-row">
        <label class="filter"><span class="flabel">Station</span>
          <div class="selwrap"><select id="fStation">
            <option value="MBJ">MBJ</option>
            <option value="KIN">KIN</option>
          </select></div></label>
        <label class="filter"><span class="flabel">Year</span>
          <div class="selwrap"><select id="fYear"></select></div></label>
        <label class="filter"><span class="flabel">Month</span>
          <div class="selwrap"><select id="fMonth"></select></div></label>
      </div>
      <div class="filter-row">
        <div class="filter"><span class="flabel">Date range</span>
          <div class="daterange"><input type="date" id="fFrom"><span class="darrow">&rarr;</span><input type="date" id="fTo"></div></div>
      </div>
      <div class="daytabs" id="daytabs"></div>
    </div>
    <div class="rightcol">
      <div class="rightfilters">
        <label class="filter"><span class="flabel">Airline</span>
          <div class="selwrap"><select id="fAirline"><option value="ALL">All airlines</option></select></div></label>
        <label class="filter"><span class="flabel">Category</span>
          <div class="selwrap"><select id="fCategory"><option value="ALL">All flights</option><option value="PAX">Pax</option><option value="CGO">Cargo</option></select></div></label>
      </div>
      <div class="week-summary" id="weekSummary"></div>
    </div>
  </div>

  <div id="app"></div>

<script>
  const CONFIG = { endpoint: 'projections.json', refreshMs: 5*60*1000 };
  const STATION_NAMES = { MBJ:"Sangster Intl", KIN:"Norman Manley Intl" };

  // Fallback so the page still works in preview / if the fetch fails.
  const FALLBACK = {
    "2026-08": {
      MBJ:{ workbook:"#", weeks:[
        {week:1,start:"2026-08-03",end:"2026-08-09",flights:138,note:"Standard summer schedule."},
        {week:2,start:"2026-08-10",end:"2026-08-16",flights:151,note:"Peak Saturday wave."},
        {week:3,start:"2026-08-17",end:"2026-08-23",flights:144,note:"Mid-month."},
        {week:4,start:"2026-08-24",end:"2026-08-30",flights:149,note:"Month-end."}]},
      KIN:{ workbook:"#", weeks:[
        {week:1,start:"2026-08-03",end:"2026-08-09",flights:96,note:"Standard."},
        {week:2,start:"2026-08-10",end:"2026-08-16",flights:104,note:"AA/DL heavy."},
        {week:3,start:"2026-08-17",end:"2026-08-23",flights:99,note:"Routine."},
        {week:4,start:"2026-08-24",end:"2026-08-30",flights:101,note:"Month-end."}]}
    }
  };

  const MONTHF=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const jamaicaToday = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Jamaica'}).format(new Date());
  let todayJM = jamaicaToday();
  let CUR_PERIOD = todayJM.slice(0,7);

  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtRange(s,e){
    const sd=new Date(s+'T00:00'), ed=new Date(e+'T00:00');
    if(sd.getMonth()===ed.getMonth()) return sd.getDate()+'–'+ed.getDate()+' '+MON[ed.getMonth()];
    return sd.getDate()+' '+MON[sd.getMonth()]+' – '+ed.getDate()+' '+MON[ed.getMonth()];
  }
  function pickCurrent(list){
    let cur = list.find(w => w.start<=todayJM && todayJM<=w.end);
    if(!cur) cur = list.filter(w=>w.start>todayJM).sort((a,b)=>a.start<b.start?-1:1)[0];
    if(!cur) cur = list.slice().sort((a,b)=>a.end<b.end?1:-1)[0];
    return cur;
  }
  // the week that actually contains today (null if today is outside this month's weeks)
  function todayWeek(list){ return list.find(w => w.start<=todayJM && todayJM<=w.end) || null; }
  // the published month closest to today, so the board opens on 'now' even if the exact month isn't built yet
  function nearestPeriod(){
    const periods=Object.keys(ALL).filter(p=>/^\d{4}-\d{2}$/.test(p)).sort();
    if(!periods.length) return CUR_PERIOD;
    if(periods.includes(CUR_PERIOD)) return CUR_PERIOD;
    const idx=p=>{const a=p.split('-');return (+a[0])*12+(+a[1]-1);};
    const c=idx(CUR_PERIOD);
    return periods.slice().sort((a,b)=>Math.abs(idx(a)-c)-Math.abs(idx(b)-c))[0];
  }
  function featuredCard(w, workbook, label){
    const pend=(!workbook||workbook==='#');
    const pending=(w.flights==null);
    const count = pending ? '<b>—</b><span>Pending</span>' : `<b>${w.flights}</b><span>Flights</span>`;
    const note = pending ? '<div class="f-note">Projection not yet built — open the workbook to build it.</div>'
                         : (w.note ? `<div class="f-note">${w.note}</div>` : '');
    return `<a ${pend?'class="featured pending"':`class="featured" href="${workbook}" target="_blank" rel="noopener"`}>
      <div><div class="f-pill"><span class="dot"></span>${label||'Selected Week'}</div>
        <div class="f-week">Week ${w.week}</div>
        <div class="f-dates">${fmtRange(w.start,w.end)}</div>
        ${note}</div>
      <div class="f-right"><div class="f-count">${count}</div>
        <div class="f-open">Open workbook →</div></div></a>`;
  }
  function weekCard(w, workbook){
    const pend=(!workbook||workbook==='#');
    const meta = (w.flights==null) ? '<span class="w-pending">Projection pending</span>'
                                   : `<b>${w.flights}</b> flights${w.note ? ' · '+w.note : ''}`;
    return `<a ${pend?'class="week pending"':`class="week" href="${workbook}" target="_blank" rel="noopener"`}>
      <div class="w-num">Week ${w.week}</div>
      <div class="w-dates">${fmtRange(w.start,w.end)}</div>
      <div class="w-meta">${meta}</div></a>`;
  }

  let ALL = {};

  // ---- date-range helpers ----
  const lastDay=(y,m)=>new Date(y,m,0).getDate();                    // m = 1..12
  function monthBounds(period){ const y=+period.slice(0,4), m=+period.slice(5,7); return [period+'-01', period+'-'+String(lastDay(y,m)).padStart(2,'0')]; }
  function daysInRange(a,b){ const out=[]; let x=a,g=0; while(x<=b && g<400){ out.push(x); x=addDays(x,1); g++; } return out; }
  function monthsInRange(a,b){ const s=new Set(); daysInRange(a,b).forEach(d=>s.add(d.slice(0,7))); return [...s]; }
  function defaultRange(){
    const period=fYear.value+'-'+fMonth.value, [a,b]=monthBounds(period);
    const fFrom=document.getElementById('fFrom'), fTo=document.getElementById('fTo');
    fFrom.value=a; fTo.value=b;
    const y=+period.slice(0,4); fFrom.min=fTo.min=(y-1)+'-01-01'; fFrom.max=fTo.max=(y+1)+'-12-31';
  }
  function onRangeChange(){
    const fFrom=document.getElementById('fFrom'), fTo=document.getElementById('fTo');
    if(fTo.value && fFrom.value && fTo.value<fFrom.value) fTo.value=fFrom.value;
    render();
  }
  function render(){
    const period = fYear.value + '-' + fMonth.value, station = fStation.value;
    const app = document.getElementById('app'), daytabsEl=document.getElementById('daytabs'), wsEl=document.getElementById('weekSummary');
    const so = (ALL[period]||{})[station];
    if(!so){
      app.innerHTML = '<div class="empty">No projection published for '+(MONTHF[+fMonth.value-1]||'')+' '+fYear.value+' yet.</div>';
      if(daytabsEl) daytabsEl.innerHTML=''; if(wsEl) wsEl.innerHTML='';
      return;
    }
    const list=(so.weeks||[]).slice().sort((a,b)=>a.week-b.week);
    const wb = so.workbook || '#';
    const monthTotal = list.reduce((s,w)=> s + (w.flights||0), 0);
    const anyData = list.some(w=> w.flights!=null);
    const isCurMonth = (period === CUR_PERIOD);
    wsEl.innerHTML = `<div class="ws-station">${station} · ${STATION_NAMES[station]||''}</div>
      <div class="ws-count"><b>${anyData?monthTotal:'—'}</b><div class="ws-lbl"><span>Flights</span>${isCurMonth?'<small>this month</small>':''}</div></div>
      ${(wb&&wb!=='#')?`<a class="ws-open" href="${wb}" target="_blank" rel="noopener">Open workbook →</a>`:'<span class="ws-open disabled">Workbook pending</span>'}`;
    app.innerHTML = '<div id="daypanel"></div>';
    fillDays(station, period);
  }
  let VIEW_MODE='list';
  let AIRLINE_FILTER='ALL';
  let CATEGORY_FILTER='ALL';   // ALL | PAX | CGO  (Cargo = service type CGO; everything else = Pax)
  let SELECTED_DAY=null;       // preserve the chosen day across refreshes / filter changes
  async function fillDays(station, period){
    const daytabsEl=document.getElementById('daytabs'), panel=document.getElementById('daypanel'),
          fAirline=document.getElementById('fAirline'), fCategory=document.getElementById('fCategory'),
          fFrom=document.getElementById('fFrom'), fTo=document.getElementById('fTo');
    const from=fFrom.value, to=fTo.value;
    const days=daysInRange(from,to);
    const all=await loadMonths(monthsInRange(from,to));
    const F=all[station]||{};
    const monthData=(await loadMonths([period]))[station]||{};   // full active month, for the summary count
    const catOf=f=>typeCls(f.type)==='cgo'?'CGO':'PAX';
    // airlines appearing in the selected range → dropdown options
    const airlines=[...new Set(days.flatMap(iso=>(F[iso]||[]).map(f=>f.airline)).filter(Boolean))].sort();
    if(fAirline){
      if(AIRLINE_FILTER!=='ALL' && !airlines.includes(AIRLINE_FILTER)) AIRLINE_FILTER='ALL';
      fAirline.innerHTML='<option value="ALL">All airlines</option>'+airlines.map(a=>`<option value="${a}">${a}</option>`).join('');
      fAirline.value=AIRLINE_FILTER;
      fAirline.onchange=()=>{ AIRLINE_FILTER=fAirline.value; renderTabs(); paint(); updateSummary(); };
    }
    if(fCategory){
      fCategory.value=CATEGORY_FILTER;
      fCategory.onchange=()=>{ CATEGORY_FILTER=fCategory.value; renderTabs(); paint(); updateSummary(); };
    }
    const filt=arr=>arr.filter(f=>(AIRLINE_FILTER==='ALL'||f.airline===AIRLINE_FILTER)&&(CATEGORY_FILTER==='ALL'||catOf(f)===CATEGORY_FILTER));
    const so=(ALL[period]||{})[station]||{}; const stationTotal=(so.weeks||[]).reduce((s,w)=>s+(w.flights||0),0);
    const isCurMonth=(period===CUR_PERIOD);
    function updateSummary(){
      const wsEl=document.getElementById('weekSummary'); if(!wsEl) return;
      const b=wsEl.querySelector('.ws-count b'), lbl=wsEl.querySelector('.ws-lbl'); if(!b||!lbl) return;
      if(AIRLINE_FILTER==='ALL' && CATEGORY_FILTER==='ALL'){ b.textContent=stationTotal; lbl.innerHTML='<span>Flights</span>'+(isCurMonth?'<small>this month</small>':''); }
      else {
        let c=0; for(const iso in monthData){ if(iso.startsWith(period)) c+=monthData[iso].filter(f=>!f.cont && (AIRLINE_FILTER==='ALL'||f.airline===AIRLINE_FILTER) && (CATEGORY_FILTER==='ALL'||catOf(f)===CATEGORY_FILTER)).length; }
        b.textContent=c;
        const tag=[AIRLINE_FILTER!=='ALL'?AIRLINE_FILTER:null, CATEGORY_FILTER==='CGO'?'Cargo':CATEGORY_FILTER==='PAX'?'Pax':null].filter(Boolean).join(' · ');
        lbl.innerHTML='<span>'+tag+'</span>'+(isCurMonth?'<small>this month</small>':'');
      }
    }
    let curIso=null;
    function renderTabs(){
      let html='';
      days.forEach(iso=>{
        const d=new Date(iso+'T00:00'), dow=d.getDay(), isT=iso===todayJM, n=filt(F[iso]||[]).length;
        const wknd=(dow===0||dow===6)?' wknd':'';
        html+=`<div class="daytab${isT?' today':''}${n?'':' void'}${iso===curIso?' active':''}${wknd}" data-day="${iso}"><span class="dow">${DOW[dow].slice(0,2)}</span><span class="dnum">${d.getDate()}</span><span class="dmon">${MON3[d.getMonth()].toUpperCase()}</span></div>`;
      });
      daytabsEl.innerHTML=html;
      daytabsEl.querySelectorAll('.daytab').forEach(t=>t.addEventListener('click',()=>showDay(t.dataset.day)));
      const act=daytabsEl.querySelector('.daytab.active'); if(act) daytabsEl.scrollLeft=act.offsetLeft-daytabsEl.clientWidth/2+act.clientWidth/2;
    }
    function paint(){
      if(!panel) return;
      const list=filt(F[curIso]||[]);
      const toggle=`<div class="viewbar"><div class="vtoggle">`
        +`<button class="vbtn${VIEW_MODE==='list'?' on':''}" data-v="list">List</button>`
        +`<button class="vbtn${VIEW_MODE==='timeline'?' on':''}" data-v="timeline">Timeline</button></div></div>`;
      const body = VIEW_MODE==='timeline' ? dayTimeline(list, curIso===todayJM) : dayPanel(list);
      panel.innerHTML = toggle + body;
      panel.querySelectorAll('.vbtn').forEach(b=>b.addEventListener('click',()=>{ VIEW_MODE=b.dataset.v; paint(); }));
    }
    function showDay(iso){ curIso=iso; SELECTED_DAY=iso; renderTabs(); paint(); applyTheme(iso); }
    renderTabs();
    const def=(SELECTED_DAY && days.includes(SELECTED_DAY)) ? SELECTED_DAY : (days.includes(todayJM)?todayJM:(days[0]||todayJM));
    showDay(def);
    updateSummary();
  }

  // ── Flight list (single-station) ──
  const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const addDays=(iso,n)=>{const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};

  let AIRPORTS={};
  async function loadAirports(){
    try{ const r=await fetch('airports.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) AIRPORTS=await r.json(); }catch(e){}
  }
  const cityOf=c=>AIRPORTS[c]||'';
  const portCell=(code)=>{ const city=cityOf(code); return code+(city?' <span class="fcity">'+city+'</span>':''); };
  const flightCache={};
  async function loadMonths(months){
    const merged={};   // station -> date -> entries   (each date lives in exactly one month file)
    for(const p of months){
      let data=flightCache[p];
      if(data===undefined){
        data=null;
        try{ const r=await fetch('flights-'+p+'.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) data=await r.json(); }catch(e){}
        if(!data) data=FLIGHT_FALLBACK[p]||null;
        flightCache[p]=data;   // cache the month file (may be null)
      }
      if(!data) continue;
      for(const stn in data){
        const dst=merged[stn]||(merged[stn]={});
        for(const date in data[stn]){ (dst[date]||(dst[date]=[])).push(...data[stn][date]); }
      }
    }
    return merged;
  }
  function routeStr(f){
    if(f.from && f.to) return f.from+' → '+f.to;
    if(f.from) return f.from+' →';
    if(f.to) return '→ '+f.to;
    return '—';
  }
  function typeCls(t){t=(t||'').toUpperCase();
    if(t.indexOf('RON')>=0)return'ron'; if(t.indexOf('CGO')>=0)return'cgo';
    if(t.indexOf('FS')>=0)return'fs'; if(t.indexOf('T/A')>=0)return'ta'; return'oth';}

  // ---- Timeline (clash) view ----
  function toMin(t){ if(!t||typeof t!=='string') return null; const m=t.match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1]*60 + +m[2]) : null; }
  function barInterval(f){
    const cls=typeCls(f.type), H=60, ty=(f.type||'').toUpperCase();
    const sta=toMin(f.sta), std=toMin(f.std);
    if(cls==='ron'){                                   // RON: fixed 1-hour bar
      if(f.cont){ if(std!=null) return [std-H,std]; if(sta!=null) return [sta,sta+H]; }
      else      { if(sta!=null) return [sta,sta+H]; if(std!=null) return [std-H,std]; }
      return null;
    }
    if(ty.indexOf('R/S')>=0){                          // R/S: fixed 1-hour bar
      if(sta!=null) return [sta,sta+H]; if(std!=null) return [std-H,std]; return null;
    }
    if(sta!=null && std!=null) return std>sta ? [sta,std] : [sta,sta+H];  // T/A, CGO, FS: real ground span
    if(sta!=null) return [sta,sta+H];
    if(std!=null) return [std-H,std];
    return null;
  }
  function dayTimeline(list, isToday){
    if(!list || !list.length) return '<div class="ftable"><div class="fempty">No flights listed for this day.</div></div>';
    const items=[];
    list.forEach(f=>{ const iv=barInterval(f); if(iv) items.push({f, s:iv[0], e:iv[1]}); });
    if(!items.length) return '<div class="ftable"><div class="fempty">No timed movements to plot for this day.</div></div>';
    let lo=Math.min(...items.map(i=>i.s)), hi=Math.max(...items.map(i=>i.e));
    lo=Math.max(0,Math.floor(lo/60)*60); hi=Math.min(1440,Math.ceil(hi/60)*60);
    if(hi-lo<120) hi=Math.min(1440, lo+120);
    const span=hi-lo, pct=m=>((m-lo)/span*100);
    items.sort((a,b)=>a.s-b.s || a.e-b.e);
    const laneEnd=[];
    items.forEach(it=>{ let p=false; for(let i=0;i<laneEnd.length;i++){ if(it.s>=laneEnd[i]){ it.lane=i; laneEnd[i]=it.e; p=true; break; } } if(!p){ it.lane=laneEnd.length; laneEnd.push(it.e); } });
    const ROW=30, PAD=8, bodyH=PAD*2+laneEnd.length*ROW, minW=Math.max(660, Math.round(span/60*92));
    let grid='', axis='';
    for(let h=Math.ceil(lo/60)*60; h<=hi; h+=60){ const L=pct(h); grid+=`<div class="tl-grid" style="left:${L}%"></div>`; axis+=`<div class="tl-hr" style="left:${L}%">${String(h/60|0).padStart(2,'0')}:00</div>`; }
    let nowLine='';
    if(isToday){ const hhmm=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Jamaica',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()); const nm=toMin(hhmm); if(nm!=null && nm>=lo && nm<=hi) nowLine=`<div class="tl-now" style="left:${pct(nm)}%"></div>`; }
    const bars=items.map(it=>{
      const f=it.f, cls=typeCls(f.type);
      const left=pct(it.s), width=Math.max(1.4, pct(it.e)-pct(it.s)), top=PAD+it.lane*ROW;
      const num = f.cont ? (f.dep??'') : (f.arr!=null ? (''+f.arr+((f.dep!=null && f.dep!==f.arr)?'/'+f.dep:'')) : (f.dep??''));
      const label=`${f.airline||''} ${num}`.trim();
      const tip=`${label}  ·  ${f.sta||'--:--'}–${f.std||'--:--'}  ·  ${f.from||'—'}→${f.to||'—'}  ·  ${f.acft||''}  ·  ${f.type||''}`;
      return `<div class="tl-bar ${cls}" style="left:${left}%;width:${width}%;top:${top}px" title="${tip}"><span class="tl-lbl">${label}</span></div>`;
    }).join('');
    // concurrency profile (how many on the ground) + peak window, shown as a strip beneath the bars
    const CLASH_BUFFER=12; // minutes a stand stays "occupied" after a departure, so near-misses still count as a clash
    const evs=[]; items.forEach(it=>{ evs.push({t:it.s,d:1}); evs.push({t:Math.min(1440,it.e+CLASH_BUFFER),d:-1}); }); evs.sort((a,b)=>a.t-b.t);
    const uniq=[...new Set(evs.map(e=>e.t))].sort((a,b)=>a-b);
    let cur=0, ei=0, segs=[], maxC=0;
    for(let i=0;i<uniq.length;i++){ const t=uniq[i]; while(ei<evs.length && evs[ei].t===t){ cur+=evs[ei].d; ei++; } const tn=uniq[i+1]; if(tn!=null){ segs.push([t,tn,cur]); if(cur>maxC) maxC=cur; } }
    const hhmm=m=>String((m/60)|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    let windows=[]; segs.filter(s=>s[2]===maxC).forEach(s=>{ const last=windows[windows.length-1]; if(last && last[1]===s[0]) last[1]=s[1]; else windows.push([s[0],s[1]]); });
    const peakTxt=windows.map(w=>hhmm(w[0])+'–'+hhmm(w[1])).join(', ');
    let conc='';
    if(maxC>0){ let path='M '+lo+' '+maxC; segs.forEach(s=>{ path+=' L '+s[0]+' '+(maxC-s[2])+' L '+s[1]+' '+(maxC-s[2]); }); path+=' L '+hi+' '+maxC+' Z';
      const hov=segs.map(s=>`<rect x="${s[0]}" y="0" width="${s[1]-s[0]}" height="${maxC}"><title>${s[2]} on ground · ${hhmm(s[0])}–${hhmm(s[1])}</title></rect>`).join('');
      conc=`<div class="tl-conc-wrap"><div class="tl-conc-lbl">Peak <b>${maxC}</b> on ground · <b>${peakTxt}</b></div><svg class="tl-conc" viewBox="${lo} 0 ${span} ${maxC}" preserveAspectRatio="none" style="width:100%;height:48px;display:block"><path d="${path}" fill="rgba(246,192,74,.13)" stroke="rgba(246,192,74,.65)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>${hov}</svg></div>`; }
    return `<div class="tl"><div class="tl-inner" style="min-width:${minW}px">
      <div class="tl-axis">${axis}</div>
      <div class="tl-body" style="height:${bodyH}px">${grid}${nowLine}${bars}</div>
      ${conc}
    </div></div><div class="fcount">${items.length} movements · timeline</div>`;
  }
  function dayPanel(list){
    if(!list||!list.length) return '<div class="ftable"><div class="fempty">No flights listed for this day.</div></div>';
    const rows=list.map(f=>{
      const cls=typeCls(f.type);
      const isRon = cls==='ron';
      const mArr = '<span class="cont-mark" title="Arrived overnight (prev. day)">↳ o/n</span>';
      const mDep = '<span class="cont-mark" title="Remains overnight — departs next day">o/n ↴</span>';
      const arrN = f.cont ? mArr : (f.arr??'—');
      const depN = (isRon && !f.cont) ? mDep : (f.dep??'—');
      const staCell = f.cont ? mArr : (f.sta||'—');
      const stdCell = (isRon && !f.cont) ? mDep : (f.std||'—');
      const logo = f.airline ? `<span class="alogo-chip"><img class="alogo" src="logos/${f.airline}.png" alt="" onerror="this.closest('.alogo-chip').remove()"></span>` : '';
      const rowCls = f.cont ? 'controw' : (isRon ? 'ronrow' : '');
      const rey = f.redeye ? '<span class="redeye-badge" title="Red-eye (22:00–05:00)">☾</span>' : '';
      return `<div class="frow${rowCls?' '+rowCls:''}">
        <span class="flogo">${logo}</span>
        <span class="fcode">${f.airline||''}</span>
        <span class="fnum">${arrN} <span class="fnsep">/</span> ${depN}</span>
        <span class="ftime">${staCell}</span>
        <span class="ftime">${stdCell}</span>
        <span class="fport">${f.cont ? mArr : (f.from?portCell(f.from):'—')}</span>
        <span class="fport fdest">${(isRon && !f.cont) ? mDep : (f.to?portCell(f.to):'—')}</span>
        <span class="facft">${f.acft??''}</span>
        <span class="ftype-cell"><span class="ftype ${cls}">${f.type}${f.cont?' ↴':''}</span>${rey}</span></div>`;
    }).join('');
    return `<div class="ftable">
      <div class="frow fhead"><span class="fhead-air">Airline</span><span>Flight Number</span><span>STA</span>
        <span>STD</span><span>Origin</span><span>Dest</span><span>Acft</span><span>Type</span></div>
      <div class="fbody">${rows}</div></div>
      <div class="fcount">${list.length} movements</div>`;
  }

  const fYear=document.getElementById('fYear'),
        fMonth=document.getElementById('fMonth'),
        fStation=document.getElementById('fStation');

  function monthsForYear(year){
    return Object.keys(ALL).filter(p=>p.startsWith(year+'-')).map(p=>p.slice(5,7)).sort();
  }
  function populateMonths(year, preferMM){
    const months = monthsForYear(year);
    fMonth.innerHTML = months.map(mm=>`<option value="${mm}">${MONTHF[+mm-1]}</option>`).join('');
    if(!months.length){ fMonth.disabled=true; return; }
    fMonth.disabled=false;
    fMonth.value = (preferMM && months.includes(preferMM)) ? preferMM : months[months.length-1];
  }

  let THEMING_ON = true;
  try{ THEMING_ON = (localStorage.getItem('occ_theming') !== 'off'); }catch(e){}
  const _addD=(iso,n)=>{const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
  function easterSunday(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h2=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h2-k)%7,m=Math.floor((a+11*h2+22*l)/451),mo=Math.floor((h2+l-7*m+114)/31),da=((h2+l-7*m+114)%31)+1; return y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0'); }
  function nthWeekday(y,month,weekday,n){ const first=new Date(y,month-1,1); const day=1+((7+weekday-first.getDay())%7)+(n-1)*7; return y+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0'); }
  function lastWeekday(y,month,weekday){ const last=new Date(y,month,0); const diff=(7+last.getDay()-weekday)%7; return y+'-'+String(month).padStart(2,'0')+'-'+String(last.getDate()-diff).padStart(2,'0'); }
  function holidaysFor(y){ const e=easterSunday(y); return [
    {d:y+'-01-01', theme:'newyear', label:"New Year's Day"},
    {d:y+'-02-14', theme:'valentines', label:"Valentine's Day"},
    {d:lastWeekday(y,2,5), theme:'jamaica-day', label:'Jamaica Day'},
    {d:nthWeekday(y,5,0,2), theme:'mothers-day', label:"Mother's Day"},
    {d:nthWeekday(y,5,3,1), theme:'teachers-day', label:"Teacher's Day"},
    {d:y+'-05-12', theme:'nurses-day', label:'Intl Nurses Day'},
    {d:nthWeekday(y,6,0,3), theme:'fathers-day', label:"Father's Day"},
    {d:nthWeekday(y,11,0,2), theme:'remembrance-day', label:'Remembrance Day'},
    {d:_addD(e,-46), theme:'ash-wednesday', label:'Ash Wednesday'},
    {d:_addD(e,-2),  theme:'good-friday', label:'Good Friday'},
    {d:_addD(e,1),   theme:'easter',  label:'Easter Monday'},
    {d:_addD(e,6),   theme:'carnival', label:'Jamaica Carnival'},
    {d:_addD(e,7),   theme:'carnival', label:'Jamaica Carnival'},

    {d:y+'-12-25', theme:'christmas', label:'Christmas Day'},
    {d:y+'-12-26', theme:'boxing-day', label:'Boxing Day'},
  ]; }
  // Month-long themes (awareness/season). A specific-day holiday above overrides these.
  const MONTH_THEMES = {
    '02': {theme:'reggae',        label:'Reggae Month'},
    '04': {theme:'earth',         label:'Earth Month'},
    '05': {theme:'child',         label:'Child Month'},
    '10': {theme:'breast-cancer', label:'Breast Cancer Awareness'},
    '11': {theme:'mens-health',   label:"Men's Health Month"},
    '12': {theme:'festive',       label:'Festive season'},
  };
  function getTheme(iso){
    if(!iso) return {theme:'',label:''};
    const y=+iso.slice(0,4);
    for(const h of holidaysFor(y)){ if(h.d===iso) return {theme:h.theme,label:h.label}; }
    const mt = MONTH_THEMES[iso.slice(5,7)];
    if(mt) return {theme:mt.theme, label:mt.label};
    return {theme:'',label:''};
  }
  function applyTheme(iso){
    const r = THEMING_ON ? getTheme(iso) : {theme:'',label:''};
    document.documentElement.setAttribute('data-theme', r.theme||'');
    const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const SET = (THEMING_ON && !reduceMotion) ? THEME_MOTIFS_ANIM : THEME_MOTIFS;
    const mv=document.getElementById('headmotif'); if(mv) mv.innerHTML='<svg viewBox="0 0 260 116">'+(SET[r.theme]||SET['default'])+'</svg>';
    const sl=document.getElementById('seasonLabel'); if(sl){ if(THEMING_ON && r.label){ sl.textContent=r.label; sl.style.display='inline-block'; } else sl.style.display='none'; }
  }
  function wireThemeToggle(){
    const tt=document.getElementById('themeToggle'), ts=document.getElementById('ttState');
    if(!tt || window.__themeWired) { if(ts) ts.textContent=THEMING_ON?'on':'off'; return; }
    tt.classList.toggle('off', !THEMING_ON); if(ts) ts.textContent=THEMING_ON?'on':'off';
    tt.addEventListener('click',()=>{ THEMING_ON=!THEMING_ON; try{localStorage.setItem('occ_theming', THEMING_ON?'on':'off');}catch(e){} tt.classList.toggle('off',!THEMING_ON); if(ts) ts.textContent=THEMING_ON?'on':'off'; applyTheme(SELECTED_DAY||todayJM); });
    window.__themeWired=true;
  }

  function buildFilters(){
    const periods=Object.keys(ALL);
    const yrs=new Set(periods.map(p=>p.slice(0,4)));
    const nowY=+CUR_PERIOD.slice(0,4);
    for(let y=Math.min(nowY, ...[...yrs].map(Number).concat([nowY])); y<=2030; y++) yrs.add(String(y));
    const years=[...yrs].sort();
    fYear.innerHTML = years.map(y=>`<option value="${y}">${y}</option>`).join('');

    const startPeriod = nearestPeriod();
    fYear.value = startPeriod.slice(0,4);
    populateMonths(startPeriod.slice(0,4), startPeriod.slice(5,7));

    // remember the employee's last station (per browser)
    try{ const s=localStorage.getItem('occ_station'); if(s==='MBJ'||s==='KIN') fStation.value=s; }catch(e){}

    defaultRange();   // range defaults to the whole active month
    if(!window.__filtersWired){
      fStation.addEventListener('change', ()=>{ try{ localStorage.setItem('occ_station', fStation.value); }catch(e){} defaultRange(); render(); });
      fYear.addEventListener('change', ()=>{ populateMonths(fYear.value); defaultRange(); render(); });
      fMonth.addEventListener('change', ()=>{ defaultRange(); render(); });
      document.getElementById('fFrom').addEventListener('change', onRangeChange);
      document.getElementById('fTo').addEventListener('change', onRangeChange);
      window.__filtersWired = true;
    }
    wireThemeToggle();
    render();
  }

  async function load(){
    await loadAirports();
    try{
      const r=await fetch(CONFIG.endpoint+'?t='+Date.now(),{cache:'no-store'});
      if(!r.ok) throw new Error(r.status);
      const d=await r.json();
      ALL = (d && Object.keys(d).length) ? d : FALLBACK;
    }catch(e){ console.error('Projections fetch failed, using fallback:',e); ALL=FALLBACK; }
    buildFilters();
  }
  load();
  // refresh data quietly, preserving the user's current selection; re-default at midnight (Jamaica)
  setInterval(async()=>{
    const now = jamaicaToday();
    const rolled = (now !== todayJM);
    if(rolled){ todayJM = now; CUR_PERIOD = now.slice(0,7); SELECTED_DAY = null; }
    try{
      const r=await fetch(CONFIG.endpoint+'?t='+Date.now(),{cache:'no-store'});
      if(r.ok){ const d=await r.json(); if(d&&Object.keys(d).length) ALL=d; }
    }catch(e){}
    if(rolled) buildFilters(); else render();
  }, CONFIG.refreshMs);
</script>
</body>
</html>
